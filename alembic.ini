[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# 实际连接串由 migrations/env.py 从 Settings 读取，此处只保留 Alembic 必需占位值。
sqlalchemy.url = postgresql+psycopg://unused@localhost/unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


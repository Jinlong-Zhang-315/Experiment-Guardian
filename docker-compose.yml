x-backend-build: &backend-build
  context: .
  args:
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

services:
  cockroachdb:
    image: cockroachdb/cockroach:v26.2.0
    command:
      - start-single-node
      - --insecure
      - --store=path=/cockroach/cockroach-data,size=${COCKROACH_STORE_SIZE:-200GiB}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COCKROACH_SQL_PORT:-26257}:26257"
      - "127.0.0.1:${COCKROACH_HTTP_PORT:-8080}:8080"
    volumes:
      - experiment_guardian_crdb:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=127.0.0.1", "--execute=SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - experiment_guardian_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc version enable "local/$${S3_BUCKET}"
        version_info="$$(mc version info "local/$${S3_BUCKET}" --json)"
        case "$${version_info}" in
          *Enabled*|*enabled*) ;;
          *) echo "MinIO bucket versioning verification failed" >&2; exit 1 ;;
        esac

  migration:
    build: *backend-build
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: .env.local
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: "no"

  database-init:
    image: cockroachdb/cockroach:v26.2.0
    command:
      - sql
      - --insecure
      - --host=cockroachdb:26257
      - --execute=CREATE DATABASE IF NOT EXISTS experiment_guardian
    depends_on:
      cockroachdb:
        condition: service_healthy
    restart: "no"

  local-init:
    build: *backend-build
    command:
      - experiment-guardian-admin
      - bootstrap-local
      - --project-config
      - examples/project-initialize.json
    env_file: .env.local
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: *backend-build
    command:
      - uvicorn
      - experiment_guardian.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file: .env.local
    depends_on:
      local-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: *backend-build
    command: ["experiment-guardian-worker"]
    env_file: .env.local
    depends_on:
      local-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  agent-worker:
    profiles: ["agent"]
    build: *backend-build
    command: ["experiment-guardian-agent-worker"]
    env_file: .env.local
    depends_on:
      local-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./web
    environment:
      NGINX_ALLOWED_HOSTS: "127.0.0.1 localhost"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"

volumes:
  experiment_guardian_crdb:
  experiment_guardian_minio:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-guardian"
version = "0.1.0"
description = "提高深度学习实验一致性、可追溯性和风险可见性的治理服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi<1",
  "uvicorn[standard]<1",
  "pydantic<3",
  "pydantic-settings<3",
  "sqlalchemy<3",
  "psycopg[binary]<4",
  "alembic<2",
  "langgraph<2",
  "mcp[cli]>=1.27,<2",
  "PyYAML<7",
  "structlog<26",
  "python-multipart<1",
  "httpx<1",
  "boto3<2",
]

[project.scripts]
experiment-guardian-api = "experiment_guardian.main:run"
experiment-guardian-mcp = "experiment_guardian.mcp_server.server:run"
experiment-guardian-admin = "experiment_guardian.admin_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
